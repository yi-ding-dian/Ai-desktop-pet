# electron-builder 配置：Linux AppImage + deb 打包；Windows NSIS 安装包 + portable 单文件
appId: com.yicaibao.aipet
productName: AI 桌面宠物
# 注：deb 打包器（fpm）还要求 homepage —— 该字段只能在 package.json 里给（见 frontend/package.json）
electronVersion: 33.4.11
# 命名约定：productName 决定用户看到的名称（应用菜单、窗口标题），保持中文；
# 产物文件名（artifactName）一律 ASCII —— 中文名在下载 URL 里会被百分号编码、命令行和传输环节易乱码。
# 只保留中英文语言包（locales 40M → ~2M，显著减小产物）
electronLanguages:
  - zh-CN
  - en-US
# 使用本地 electron 分发，跳过 GitHub 下载（避免网络卡死）
electronDist: node_modules/electron/dist
directories:
  # 产物统一落项目根的 deploy/release/（本项目 npm 根是 frontend/，故为 ../）
  output: ../deploy/release
  buildResources: build
files:
  # 主/预加载/渲染进程全部产物；main 进程无外部 runtime 依赖（react/three 等已被 vite 打进 out/renderer），
  # 故显式排除 node_modules（electron-builder 默认会把 production dependencies 收进 asar，纯属多余体积）。
  # 若将来 main/preload 直接 import 外部依赖，需在此放开并补 files 规则。
  - out/**/*
  - '!node_modules/**/*'
  # 单测产物不入包：npm run test:* 会把测试 bundle 编译到 out/tests/（与 out/main 等同一目录树），
  # 若不排除会被 out/**/* 一并收进 asar（跑过一次测试后打出来的包就带上了）——测试代码不进产物。
  - '!out/tests/**/*'
asar: true
npmRebuild: false
extraResources:
  # PyInstaller 后端（deploy/build.sh 第 1 步产出）→ resources/backend/
  # 运行期由 electron/backend-process/locate.ts 以 process.resourcesPath/backend/backend 定位
  - from: resources/backend
    to: backend
    filter:
      - '**/*'
      - '!**/__pycache__/**'
  # 托盘图标 → resources/tray-icon.png（build/ 是构建元数据目录、默认不进安装包，
  # 托盘图标必须走 extraResources；运行期由 electron/tray 以 process.resourcesPath/tray-icon.png 定位。
  # 直接从 build/icon.png 取——图标素材唯一源，更新即随包生效，无需手工同步副本）
  - from: build/icon.png
    to: tray-icon.png
  # 托盘锚点定位模板（fx 域：抓屏+像素匹配找兔头图标的模板）→ resources/tray-anchor-template.png
  # 运行期由 electron/fx/anchor.ts 以 process.resourcesPath/tray-anchor-template.png 定位；
  # 素材是从实测截图裁出的真实渲染托盘图标（24×24，中心=图标中心）。
  # ⚠ 托盘图标外观更新后此模板会失配（自动定位回退到托盘图标素材/兜底坐标），需重新裁制（见 docs/报告/前端/fx-report.md）
  - from: resources/tray-anchor-template.png
    to: tray-anchor-template.png
win:
  # 图标唯一源 build/icon.png（512×512）。electron-builder 会自动转出多尺寸 .ico，
  # 无需手工维护 ico 副本（素材更新即随包生效，与 Linux 侧同一约定）
  icon: build/icon.png
  target:
    - nsis
    - portable
  # 与 Linux 侧同一命名约定：文件名 ASCII（ai-desktop-pet-），界面名称保持中文（productName）
  # 注意：Windows 产物按架构分目录落 release/ 根下，见 deploy/build.ps1 的产物收集
  artifactName: ai-desktop-pet-${version}-${arch}.${ext}
  # 无代码签名证书：electron-builder 会对 exe 做「资源编辑」（写图标/版本信息）而非签名，
  # 若本机杀软把 PyInstaller 产物误报为木马，属已知问题（设计文档 §10 #6，后期代码签名解决）
  signAndEditExecutable: true
nsis:
  # 免 UAC 的每用户安装（装到 %LOCALAPPDATA%\Programs\），不写系统目录、不需要管理员
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI 桌面宠物
  # 安装向导语言：中英双语（系统语言自动选择）
  installerLanguages:
    - zh_CN
    - en_US
  # 卸载时保留用户数据（%APPDATA%\AI 桌面宠物\：config.toml / pet.db / logs）
  deleteAppDataOnUninstall: false
  artifactName: ai-desktop-pet-${version}-${arch}-setup.${ext}
portable:
  # 免安装单文件 exe：双击即跑（对应 Linux 侧的 AppImage 定位）
  # 数据目录仍走 Electron 默认 %APPDATA%，与安装包共用（换包不丢数据）
  artifactName: ai-desktop-pet-${version}-${arch}-portable.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  artifactName: ai-desktop-pet-${version}-${arch}.${ext}
  category: Utility
  maintainer: yicaibao
  synopsis: AI 桌面宠物（Electron 前端 + Python 后端）
  executableName: ai-desktop-pet
  # 窗口关联：desktopName（package.json 顶层）与 WM_CLASS 一致，桌面环境才能把窗口绑定到应用菜单条目
  syncDesktopName: true
# AppImage 压缩算法：保持 gzip（默认）。教训（2026-10-12 样板项目实测）：xz 产物虽小 22%，
# 但 AppImage 每次启动都要从 squashfs 惰性解压（挂载是全新的、不吃页缓存），冷启动 1s → 22s ——
# 启动速度远比省这 21MB 重要，不要改回 xz
appImage:
  compression: gzip
deb:
  artifactName: ai-desktop-pet-${version}-${arch}.${ext}
