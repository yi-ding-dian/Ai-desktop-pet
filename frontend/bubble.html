<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>气泡</title>
    <script>
      // 首帧防闪烁：在样式/JS 加载前按持久化主题设置明暗基调（data-theme）。
      // 只判基调（dark|light）；具体配色变量由 shared/theme 的 initTheme 注入（几十毫秒内完成）。
      // 存储格式与 src/shared/theme/index.ts 保持一致：'preset:<key>' | 'custom:<id>'
      //（兼容旧值 'dark' | 'light' | 'system'）——改格式/默认值需同步这里与其它各窗 html。
      ;(function () {
        var PRESET_TONE = {
          dark: 'dark',
          blue: 'dark',
          violet: 'dark',
          plum: 'dark',
          light: 'light',
          warm: 'light',
          mint: 'light',
          sakura: 'light'
        }
        // 默认主题 = 薄荷（浅色，§7.6.4 v2）；仅有存储值的用户走其自身选择
        var tone = 'light'
        try {
          var raw = localStorage.getItem('pet-theme') || 'preset:mint'
          var key = raw.indexOf('preset:') === 0 ? raw.slice(7) : raw
          if (key === 'system') {
            tone = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          } else if (raw.indexOf('custom:') === 0) {
            // 自定义配色：按保存的背景色亮度判基调（my-themes 里取不到则保持浅色兜底）
            var bg = ''
            try {
              var list = JSON.parse(localStorage.getItem('pet-my-themes') || '[]')
              var id = raw.slice(7)
              for (var i = 0; i < list.length; i++) {
                if (list[i] && list[i].id === id && list[i].colors) bg = String(list[i].colors.bg || '')
              }
            } catch (e2) {
              /* 数据损坏：走兜底 */
            }
            var m = bg.match(/^#?([0-9a-f]{6})$/i)
            if (m) {
              var n = parseInt(m[1], 16)
              var lum =
                (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255
              tone = lum < 0.5 ? 'dark' : 'light'
            }
          } else if (PRESET_TONE[key]) {
            tone = PRESET_TONE[key]
          }
        } catch (e) {
          /* localStorage 不可用：用默认 */
        }
        document.documentElement.dataset.theme = tone
      })()
    </script>
    <style>
      /* 气泡窗：frameless + 透明；气泡体（圆角/配色/尾巴）在 .pet-bubble 元素上 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bubble/main.tsx"></script>
  </body>
</html>
