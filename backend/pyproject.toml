# AI 桌面宠物后端（FastAPI + WebSocket）
# 安装：python3 -m venv .venv && .venv/bin/pip install -e ".[dev]" -i https://pypi.tuna.tsinghua.edu.cn/simple

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desktop-pet-backend"
version = "0.1.0"
description = "AI 桌面宠物后端：FastAPI + 本机 WebSocket"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "loguru",
    "edge-tts",
    "tomlkit",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    # DeepSeek Search / Fetch（2026-10-18）：直接用 httpx 调独立接口
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "websockets",
]

# 包名 backend 映射到本目录（项目根下 `python -m backend.main` 可运行）
# packages 交给 setuptools 自动发现，不再手写列表：
# 手写列表曾漏登记新增的 memory_book、又留着已删除的 notebook，导致 pip install -e 直接失败。
# where 相对 pyproject 目录（本目录）→ ".." 即项目根；include 只收 backend 树，不扫 frontend。
[tool.setuptools]
package-dir = { backend = "." }

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fail-safe：tests/conftest.py 也会把项目根加入 sys.path
pythonpath = [".."]
